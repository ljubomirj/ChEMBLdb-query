[pytest]
markers =
    integration: requires local ChEMBL DB and large CSV comparisons
    llm: long-running LLM-driven tests that require local provider access
    faq_hq: FAQ-based high-quality end-to-end result comparisons against executable SQL ground truth
    faq_hq_large: large FAQ result sets; disabled by default unless CHEMBL_FAQ_INCLUDE_LARGE=1
    faq_hq_massive: massive FAQ result sets; disabled by default unless CHEMBL_FAQ_INCLUDE_MASSIVE=1
    web_scrape: promoted web-scraped UQ/SQL pairs with executable SQLite ground truth
    web_scrape_large: large promoted web-scrape result sets; disabled by default unless CHEMBL_WEB_SCRAPE_INCLUDE_LARGE=1
