version: v5.14
system:
  about_block: |
    You will be used in forward and backward roles inside a ChEMBL text-to-SQL system.
    Follow the task instructions in the user message under <TASK>.
  schema_block_path: doc/chembl_database_schema.md
  hint_block_path: doc/chembl_prompt_hints_v4.11.md
  examples_block: |
    <EXAMPLES>
    Example user question:
    "Top 10 most potent compounds against EGFR by IC50"

    Example execution-plan UP:
    "Return the top 10 compounds ranked by lowest IC50 against human EGFR. Select compound identifiers and potency values only."

    Example backward reconstruction target:
    "Recover a realistic user question from the execution-plan artifact without leaking SQL syntax."

    Example salts execution-plan behavior:
    "For parent-and-salts activity queries, define the compound set with molecule_hierarchy first, then use the FAQ provenance path molecule_dictionary -> compound_records -> docs -> activities -> assays -> target_dictionary. Keep LEFT JOIN compound_structures when canonical_smiles is requested."

    Example metabolism execution-plan behavior:
    "For first-N metabolism export queries, preserve the source row stream. If the task says first 200 rows and does not explicitly request sorting, do not add ORDER BY."

    Example assay-exact alias behavior:
    "If the output asks for a molecule ChEMBL identifier, name the column molecule_chembl_id, not chembl_id. If it asks for an assay ChEMBL identifier, name the column assay_chembl_id."

    Example assay metadata behavior:
    "For bioassay metadata exports, include assay_description, target_name, target_organism, journal, year, volume, first_page, and doi when the user question requests bioassay metadata."

    Example molecule identifier behavior:
    "If the task asks for 'compounds' or 'molecules', the column must be named molecule_chembl_id. Never name the column compound_chembl_id unless the user explicitly requested it."

    Example document query behavior:
    "For document queries, list all compounds associated with a document. When the prompt asks for document molecules, use the join path molecule_dictionary -> compound_records -> docs."

    Example approved-drug alias behavior:
    "For approved-drug indication exports that ask for a compound identifier, use the alias chembl_id unless the user explicitly specified molecule_chembl_id."

    Example approved-drug family behavior:
    "For approved-drug queries, identify the task family as 'approved_drugs' if the question mentions 'approved drugs' or 'indication'. Use the family to determine join paths."
    </EXAMPLES>
pf:
  up: |
    <TASK>
    Convert a user-facing question into a compact execution-oriented User Prompt (UP).
    The UP must preserve intent, output schema, and key constraints without copying the User Question verbatim and without writing SQL.
    The UP is an execution plan, not a paraphrase of the user question.
    Rules:
    - Output valid JSON only with the key "up". The value must be a string.
    - Do not repeat the UQ with minor edits.
    - Do not use SQL keywords or write SQL syntax.
    - Normalize the task into operations a SQL writer can follow.
    - Prefer compact imperative structure such as:
      Select ...
      Join ...
      Filter ...
      Return ...
      Sort ...
      Limit ...
    - Preserve requested output columns and aliases exactly when the case requires them.
    - Identify the query family at the start of the UP if it is a known pattern:
      - 'approved_drugs' for approved-drug indication exports
      - 'salt' for parent-and-salts activity queries
      - 'assay_exact' for specific assay bioassay metadata or activity exports
      - 'metabolism' for metabolism queries
      - 'document' for document molecule list queries
      - 'target_molecules' for molecule-smiles exports against a target
    - Mention deduplication only when the task truly requires DISTINCT or explicitly forbids deduplication.
    - For FAMILY=salt queries, be explicit about the two-stage intent:
      1) define the compound set from the parent compound through molecule_hierarchy
      2) retrieve activity provenance through the FAQ path molecule_dictionary -> compound_records -> docs -> activities -> assays -> target_dictionary
    - For FAMILY=salt queries, preserve optional projection requirements such as canonical_smiles via LEFT JOIN compound_structures and requested columns like activity_comment.
    - For FAMILY=salt activity-provenance exports, expose assay_description from assays.description under the alias assay_description.
    - For FAMILY=approved_drugs indication exports that request canonical_smiles, prefer an INNER JOIN to compound_structures unless the task explicitly allows missing structures.
    - For FAMILY=approved_drugs indication exports, if the user question asks for 'chembl_id', 'compounds', or does not specify 'molecule', use the alias chembl_id. Use molecule_chembl_id only if explicitly requested.
    - For FAMILY=approved_drugs indication exports, preserve the join path molecule_dictionary -> drug_indication -> molecule_dictionary (alias indications) and use LEFT JOIN compound_structures for smiles.
    - For FAMILY=approved_drugs indication exports, map the request for 'compounds' or generic 'chembl_id' to the chembl_id alias in the SELECT clause.
    - For FAMILY=target_molecules queries that ask for distinct molecule ChEMBL IDs and canonical SMILES tested in assays against a target, prefer the direct activity path molecule_dictionary -> activities -> assays -> target_dictionary with an INNER JOIN to compound_structures. Do not add compound_records unless document provenance is explicitly requested.
    - For FAMILY=target_molecules queries, always alias the molecule identifier as molecule_chembl_id. Never use the alias compound_chembl_id for this type of query.
    - For FAMILY=target_molecules queries, always include the join path from molecule_dictionary to target_dictionary via activities and assays. Do not join via target_components or component_sequences.
    - For CRITICAL molecule-identifier aliasing rule: Under no circumstances should a query about molecules tested against a target use the alias compound_chemold_id. Always use molecule_chembl_id.
    </TASK>
  sql: |
    <TASK>
    Convert the execution-oriented User Prompt into a single executable SQLite SELECT query for ChEMBL.
    Preserve requested output schema exactly when specified.
    Output valid JSON only with the key "sql". The value must be a string containing the complete SQL query.
    Rules:
    - Return one complete JSON object only. Do not truncate the SQL.
    - For FAMILY=approved_drugs indication exports that request canonical_smiles and require max_phase = 4, use LEFT JOIN compound_structures unless the task explicitly says missing structures must be excluded.
    - For FAMILY=approved_drugs indication exports, use the skeleton:
      FROM molecule_dictionary m
      LEFT JOIN compound_structures cs ON m.molregno = cs.molregno
      JOIN drug_indication di ON m.molregno = di.molregno
      JOIN molecule_dictionary ind_mesh ON ind_mesh.mesh_id = di.mesh_id
    - For FAMILY=approved_drugs indication exports, map generic requests for compound identifiers to m.chembl_id AS chembl_id. Use molecule_chembl_id only if explicitly requested.
    - For FAMILY=approved_drugs indication exports, include m.pref_name, cs.canonical_smiles, ind_mesh.mesh_heading AS indication_label, di.mesh_id AS indication_curie, m.max_phase AS max_phase_for_ind.
    - For FAMILY=approved_drugs indication exports, do not use DISTINCT on m.chembl_id if it causes row loss for multi-indication drugs; use DISTINCT only on the requested output columns if the user requested unique compounds.
    - For FAMILY=target_molecules molecule-smiles exports that request distinct molecule ChEMBL IDs and canonical SMILES for compounds tested in assays against a target, use the gold-style skeleton:
      FROM molecule_dictionary md
      JOIN activities act ON act.molregno = md.molregno
      JOIN assays a ON act.assay_id = a.assay_id
      JOIN target_dictionary td ON a.tid = td.tid
      JOIN compound_structures cs ON cs.molregno = md.molregno
    - For those FAMILY=target_molecules exports, do not add compound_records unless document provenance is explicitly requested, and do not weaken compound_structures to a LEFT JOIN unless missing structures are explicitly allowed.
    - For FAMILY=target_molecules queries that request molecules tested against a target, always alias the molecule identifier column as molecule_chembl_id. Never use the alias compound_chembl_id.
    - For FAMILY=target_molecules queries, always join from molecule_dictionary to target_dictionary via activities and assays to get tested compounds. Joining via target_components is incorrect.
    - CRITICAL PROJECTION RULE: When selecting molecule_chembl_id for 'molecules tested against target' queries, always use the syntax 'md.chembl_id AS molecule_chembl_id'. Do not use any other alias such as compound_chembl_id.
    </TASK>
  judge: |
    <TASK>
    Judge whether the current result is good enough to stop iterating.
    This is an iterative diagnostic, not the benchmark authority.
    Output valid JSON with keys "analysis", "score", and "decision".
    </TASK>
pb:
  sql_to_up: |
    <TASK>
    Reconstruct a compact execution-oriented User Prompt from SQL.
    Preserve semantic intent, required output schema, and key constraints.
    Do not emit SQL.
    Output valid JSON only with the key "up_exec".
    </TASK>
  up_to_uq: |
    <TASK>
    Reconstruct a realistic human-facing user question from an execution-oriented User Prompt.
    Keep it natural and concise. Do not leak schema names unless a real user would likely say them.
    Rules:
    - Output valid JSON only with the key "uq_surface".
    - Prefer what a scientist or analyst would plausibly ask, not an execution spec.
    - Avoid internal table names, explicit join instructions, and implementation wording.
    - Avoid exact schema-qualified column names unless that exact schema request is central to the task.
    - Preserve intent, entity, measurement type, filters, and ordering when they matter.
    - When the execution prompt is very specific, compress it into a plausible human request rather than copying it back.
    - Prefer one sentence.
    - Prefer short natural wording over column-by-column export wording when both preserve the same intent.
    - For FAMILY=target_molecules or molecule-smiles queries, default to scientist-style asks such as:
      "Show the SMILES for compounds tested against human HSP90."
      "What molecules are active against PI3K?"
    - For FAMILY=approved_drugs indication queries, default to a clinical ask such as:
      "Which approved drugs are indicated for infection?"
      "Show approved drugs for infection with their SMILES."
      "List compounds used for infection treatment."
    - For approved-drug indication queries, do not copy back execution phrases like "chembl_id", "canonical_smiles", or "indication_label" unless necessary.
    </TASK>
  res_sql_to_intent: |
    <TASK>
    Summarize the likely task intent from SQL and a result table summary.
    Focus on entities, filters, output columns, ordering, and result shape.
    Output valid JSON only with the key "intent_sketch".
    </TASK>
scoring:
  judge_threshold: 0.9
  uq_up_echo_penalty_threshold: 0.95
  uq_up_echo_penalty_weight: 0.15